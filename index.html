<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>数据库 YAML 配置生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>数据库 YAML 配置生成器</h1>
    <p>支持多类型多数据源，内置/自定义工具可绑定任意 source，生成全局 tools/toolsets。</p>
  </header>
  <main>
    <section id="sources-manager">
      <h2>数据源管理</h2>
      <div id="sources-list"></div>
      <button type="button" id="add-source-btn">添加数据源</button>
    </section>
    <section id="builtin-tools">
      <h2>内置工具</h2>
      <div id="builtin-tools-list"></div>
    </section>
    <section id="custom-tools">
      <h2>自定义工具</h2>
      <div id="custom-tools-list"></div>
      <button type="button" id="add-custom-tool">添加自定义工具</button>
    </section>
    <section id="yaml-actions">
      <h2>YAML 操作</h2>
      <button type="button" id="generate-yaml">生成 YAML</button>
      <button type="button" id="import-yaml">导入 YAML</button>
      <input type="file" id="yaml-file-input" accept=".yaml,.yml" style="display:none">
      <button type="button" id="copy-yaml" disabled>复制 YAML</button>
      <button type="button" id="download-yaml" disabled>下载 YAML</button>
    </section>
    <section id="yaml-preview">
      <h2>YAML 预览</h2>
      <pre id="yaml-output" class="yaml-block"></pre>
    </section>
    <section id="messages">
      <div id="msg-area"></div>
    </section>
  </main>
  <footer>
    <small>本工具离线可用，所有数据仅在本地浏览器处理。源码与依赖遵循各自开源协议。</small>
  </footer>
  <script src="libs/js-yaml.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/yamlGenerator.js"></script>
  <script src="js/yamlImporter.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/download.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
